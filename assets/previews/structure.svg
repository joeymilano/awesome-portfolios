<svg width="740" height="380" viewBox="0 0 740 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="x" markerWidth="8" markerHeight="8" refX="7" refY="2.6" orient="auto">
      <path d="M0,0 L0,5.2 L7,2.6 z" fill="#dc2626"/>
    </marker>
    <marker id="ok" markerWidth="8" markerHeight="8" refX="7" refY="2.6" orient="auto">
      <path d="M0,0 L0,5.2 L7,2.6 z" fill="#4ade80"/>
    </marker>
  </defs>

  <rect width="740" height="380" fill="#0d0d12" rx="12"/>

  <text x="28" y="36" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#e8e8ef">One file per entry</text>
  <text x="28" y="54" font-family="Inter, sans-serif" font-size="11" fill="#5a5a6e">The only structural decision here, and the reason contributions scale</text>

  <!-- ── LEFT: the usual way ── -->
  <text x="28" y="88" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#dc2626">Most awesome lists</text>

  <!-- three PRs -->
  <rect x="28" y="100" width="86" height="26" rx="6" fill="#141419" stroke="#26262f"/>
  <text x="71" y="117" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#9c9cb0">PR #12</text>

  <rect x="28" y="132" width="86" height="26" rx="6" fill="#141419" stroke="#26262f"/>
  <text x="71" y="149" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#9c9cb0">PR #13</text>

  <rect x="28" y="164" width="86" height="26" rx="6" fill="#141419" stroke="#26262f"/>
  <text x="71" y="181" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#9c9cb0">PR #14</text>

  <!-- arrows converge -->
  <path d="M114 113 L166 137" stroke="#dc2626" stroke-width="1.3" fill="none" marker-end="url(#x)"/>
  <path d="M114 145 L166 145" stroke="#dc2626" stroke-width="1.3" fill="none" marker-end="url(#x)"/>
  <path d="M114 177 L166 153" stroke="#dc2626" stroke-width="1.3" fill="none" marker-end="url(#x)"/>

  <!-- single README -->
  <rect x="174" y="128" width="106" height="34" rx="6" fill="#2d1214" stroke="#7f1d1d"/>
  <text x="227" y="143" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#e8e8ef">README.md</text>
  <text x="227" y="156" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#dc2626">3 conflicts</text>

  <text x="28" y="214" font-family="Inter, sans-serif" font-size="10.5" fill="#5a5a6e">Every open PR conflicts with every other.</text>
  <text x="28" y="230" font-family="Inter, sans-serif" font-size="10.5" fill="#5a5a6e">Maintainer resolves instead of reviewing.</text>
  <text x="28" y="246" font-family="Inter, sans-serif" font-size="10.5" fill="#5a5a6e">Queue stalls, contributors leave.</text>

  <!-- divider -->
  <line x1="370" y1="76" x2="370" y2="260" stroke="#26262f"/>

  <!-- ── RIGHT: this repo ── -->
  <text x="400" y="88" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#4ade80">This repository</text>

  <rect x="400" y="100" width="86" height="26" rx="6" fill="#141419" stroke="#26262f"/>
  <text x="443" y="117" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#9c9cb0">PR #12</text>

  <rect x="400" y="132" width="86" height="26" rx="6" fill="#141419" stroke="#26262f"/>
  <text x="443" y="149" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#9c9cb0">PR #13</text>

  <rect x="400" y="164" width="86" height="26" rx="6" fill="#141419" stroke="#26262f"/>
  <text x="443" y="181" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#9c9cb0">PR #14</text>

  <!-- parallel arrows -->
  <line x1="486" y1="113" x2="530" y2="113" stroke="#4ade80" stroke-width="1.3" marker-end="url(#ok)"/>
  <line x1="486" y1="145" x2="530" y2="145" stroke="#4ade80" stroke-width="1.3" marker-end="url(#ok)"/>
  <line x1="486" y1="177" x2="530" y2="177" stroke="#4ade80" stroke-width="1.3" marker-end="url(#ok)"/>

  <!-- separate files -->
  <rect x="538" y="100" width="164" height="26" rx="6" fill="#0f2318" stroke="#14532d"/>
  <text x="550" y="117" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#9c9cb0">portfolios/ayu.json</text>

  <rect x="538" y="132" width="164" height="26" rx="6" fill="#0f2318" stroke="#14532d"/>
  <text x="550" y="149" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#9c9cb0">portfolios/budi.json</text>

  <rect x="538" y="164" width="164" height="26" rx="6" fill="#0f2318" stroke="#14532d"/>
  <text x="550" y="181" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#9c9cb0">portfolios/citra.json</text>

  <text x="400" y="214" font-family="Inter, sans-serif" font-size="10.5" fill="#5a5a6e">Separate files cannot conflict.</text>
  <text x="400" y="230" font-family="Inter, sans-serif" font-size="10.5" fill="#5a5a6e">README is generated, never edited.</text>
  <text x="400" y="246" font-family="Inter, sans-serif" font-size="10.5" fill="#5a5a6e">Merge order does not matter.</text>

  <!-- bottom: pipeline -->
  <line x1="28" y1="278" x2="712" y2="278" stroke="#26262f"/>

  <text x="28" y="302" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#e8e8ef">Pipeline</text>

  <rect x="28" y="316" width="120" height="28" rx="6" fill="#141419" stroke="#26262f"/>
  <text x="88" y="334" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#9c9cb0">data/*.json</text>

  <line x1="148" y1="330" x2="176" y2="330" stroke="#35353f" stroke-width="1.3" marker-end="url(#ok)"/>

  <rect x="184" y="316" width="120" height="28" rx="6" fill="#141419" stroke="#8b5cf6"/>
  <text x="244" y="334" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#a78bfa">validate</text>

  <line x1="304" y1="330" x2="332" y2="330" stroke="#35353f" stroke-width="1.3" marker-end="url(#ok)"/>

  <rect x="340" y="316" width="120" height="28" rx="6" fill="#141419" stroke="#26262f"/>
  <text x="400" y="334" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#9c9cb0">README.md</text>

  <line x1="460" y1="330" x2="488" y2="330" stroke="#35353f" stroke-width="1.3" marker-end="url(#ok)"/>

  <rect x="496" y="316" width="120" height="28" rx="6" fill="#141419" stroke="#26262f"/>
  <text x="556" y="334" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#9c9cb0">site/index.html</text>

  <text x="636" y="334" font-family="Inter, sans-serif" font-size="9.5" fill="#5a5a6e">all in CI</text>
</svg>
