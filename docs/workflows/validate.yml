name: Validate

on:
  pull_request:
    paths:
      - "data/portfolios/**"
      - "scripts/**"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Gives the contributor a precise answer in about thirty seconds,
      # instead of a review comment three days later.
      - run: npm run validate

      # Catches a submission that passes validation but breaks generation.
      - run: npm run build
      - run: npm run build:site